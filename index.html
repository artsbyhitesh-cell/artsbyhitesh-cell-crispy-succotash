<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,
user-scalable=no">

<title>Hitesh Kumar Mishra</title>

<meta name="description" content="Official Artist Portfolio of Hitesh Kumar Mishra">

<link rel="icon" href="Hitu.jpg">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f2ff">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Poppins',sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:#000;
color:white;
overflow-x:hidden;
position:relative;
padding:20px;
transition:0.5s;
}

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(circle,#00f2ff22 10%,transparent 10%),
radial-gradient(circle,#ff00ff22 10%,transparent 10%);
background-size:120px 120px;
animation:bgMove 18s linear infinite;
z-index:-3;
}

@keyframes bgMove{
0%{
transform:translate(0,0);
}
100%{
transform:translate(-120px,-120px);
}
}

.ball{
position:fixed;
border-radius:50%;
filter:blur(60px);
opacity:0.4;
z-index:-2;
animation:float 8s infinite alternate ease-in-out;
}

.ball1{
width:260px;
height:260px;
background:#00f2ff;
top:-100px;
left:-100px;
}

.ball2{
width:260px;
height:260px;
background:#ff00ff;
bottom:-100px;
right:-100px;
}

@keyframes float{
100%{
transform:translateY(30px) translateX(20px);
}
}

.container{
    width:100%;
    max-width:390px;
    padding:28px 22px;
    padding-top:120px;
    border-radius:28px;
    text-align:center;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:3px solid rgba(255,255,255,0.08);
    box-shadow:0 0 30px rgba(0,242,255,0.25);
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:auto;
    animation:fadeIn 1.2s ease;
    position:relative;
    animation:rgbBorder 6s linear infinite;
}

@keyframes rgbBorder{
    0%{
        border-color:#ff0000;
        box-shadow:0 0 8px #ff0000;
    }
    16%{
        border-color:#ff7300;
        box-shadow:0 0 8px #ff7300;
    }
    33%{
        border-color:#fffb00;
        box-shadow:0 0 8px #fffb00;
    }
    50%{
        border-color:#48ff00;
        box-shadow:0 0 8px #48ff00;
    }
    66%{
        border-color:#00ffd5;
        box-shadow:0 0 8px #00ffd5;
    }
    83%{
        border-color:#7a00ff;
        box-shadow:0 0 8px #7a00ff;
    }
    100%{
        border-color:#ff00c8;
        box-shadow:0 0 8px #ff00c8;
    }
}

@keyframes rgbBorder {
    0% { border-color:#ff0000; box-shadow:0 0 8px #ff0000; }
    16% { border-color:#ff7300; box-shadow:0 0 8px #ff7300; }
    33% { border-color:#fffb00; box-shadow:0 0 8px #fffb00; }
    50% { border-color:#48ff00; box-shadow:0 0 8px #48ff00; }
    66% { border-color:#00ffd5; box-shadow:0 0 8px #00ffd5; }
    83% { border-color:#7a00ff; box-shadow:0 0 8px #7a00ff; }
    100% { border-color:#ff00c8; box-shadow:0 0 8px #ff00c8; }
}

.profile img{
width:115px;
height:115px;
border-radius:50%;
object-fit:cover;
border:4px solid #00f2ff;
transition:0.5s;
animation:ledGlow 4s linear infinite;
position:absolute;
top:20px;
left:20px;
margin:0;
}

.profile img:hover{
transform:scale(1.08);
}

@keyframes ledGlow{
0%{
border-color:#ff0000;
box-shadow:0 0 10px #ff0000,0 0 20px #ff0000;
}
25%{
border-color:#00ff00;
box-shadow:0 0 10px #00ff00,0 0 20px #00ff00;
}
50%{
border-color:#00f2ff;
box-shadow:0 0 10px #00f2ff,0 0 20px #00f2ff;
}
75%{
border-color:#ff00ff;
box-shadow:0 0 10px #ff00ff,0 0 20px #ff00ff;
}
100%{
border-color:#ff0000;
box-shadow:0 0 10px #ff0000,0 0 20px #ff0000;
}
}

h1{
position:absolute;
top:30px;
right:20px;
font-size:21px;
font-weight:700;
text-align:right;
background:linear-gradient(90deg,#ffffff,#00f2ff);
background-clip:text;
-webkit-background-clip:text;
color:transparent;
-webkit-text-fill-color:transparent;
}

.typing{
position:absolute;
top:65px;
right:20px;
font-size:14px;
text-align:right;
color:#ddd;
height:20px;
}

#clock{
font-size:28px;
font-weight:700;
margin-top:20px;
text-align:center;
}

#date{
font-size:14px;
margin-bottom:20px;
text-align:center;
opacity:0.8;
}

.btn{
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
padding:14px;
margin:10px 0;
border-radius:16px;
text-decoration:none;
font-weight:600;
text-align:center;
color:white;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.06);
position:relative;
overflow:hidden;
transition:0.4s;
cursor:pointer;
}

.btn::before{
content:"";
position:absolute;
left:0;
top:0;
width:0%;
height:100%;
background:linear-gradient(90deg,#00f2ff,#ff00ff);
z-index:-1;
transition:0.5s;
}

.btn:hover::before{
width:100%;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 0 20px #00f2ff;
}

.fa-youtube{
color:#ff0000;
}

.fa-instagram{
color:#E1306C;
}

.fa-whatsapp{
color:#25D366;
}

.fa-telegram{
color:#0088cc;
}

.fa-facebook{
color:#1877f2;
}

.fa-x-twitter{
color:white;
}

.toggle{
position:fixed;
top:15px;
right:15px;
width:50px;
height:50px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
font-size:22px;
cursor:pointer;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
transition:0.4s;
z-index:1000;
}

.toggle:hover{
transform:rotate(180deg) scale(1.1);
}

.light{
background:#f5f5f5;
color:black;
}

.light .container{
background:rgba(255,255,255,0.7);
color:black;
}

.light .btn{
color:black;
}

.light .fa-x-twitter{
color:black;
}

.light h1{
background:linear-gradient(90deg,#000,#0077ff);
background-clip:text;
-webkit-background-clip:text;
color:transparent;
-webkit-text-fill-color:transparent;
}

.footer{
margin-top:auto;
padding:18px 10px;
font-size:13px;
text-align:center;
width:100%;
opacity:0.85;
}

#toast{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
background:#00f2ff;
color:black;
padding:12px 18px;
border-radius:10px;
font-weight:600;
opacity:0;
transition:0.4s;
z-index:999;
}

#toast.show{
opacity:1;
}

#installBtn{
position:fixed;
bottom:20px;
left:20px;
padding:14px 18px;
border:none;
border-radius:14px;
background:linear-gradient(90deg,#00f2ff,#ff00ff);
color:white;
font-weight:600;
font-size:14px;
cursor:pointer;
display:none;
z-index:999;
box-shadow:0 0 20px #00f2ff;
transition:0.4s;
}

#installBtn:hover{
transform:scale(1.05);
}

@media(max-width:500px){

body{
padding:15px;
}

.container{
padding:22px 18px;
border-radius:22px;
}

h1{
font-size:24px;
}

.profile img{
width:95px;
height:95px;
}

.btn{
font-size:15px;
padding:13px;
}

#clock{
font-size:24px;
}

#date{
font-size:13px;
}

.footer{
font-size:12px;
padding-bottom:15px;
}

#installBtn{
left:50%;
transform:translateX(-50%);
bottom:15px;
font-size:13px;
padding:12px 16px;
}

}

.signature{
margin-top:-50px;
margin-bottom:-50px;
text-align:right;
}

.signature img{
    width:180px;
    max-width:80%;
    opacity:0.95;
    filter: drop-shadow(0 0 5px white);
    transition:0.4s ease;
}
.light .signature img{
    filter: brightness(0.2) contrast(1.5) drop-shadow(0 0 3px white );
}

</style>
</head>

<body>

<div class="ball ball2"></div>

<div class="container">

<div class="profile">
<img src="HITESH.jpeg" alt="Hitesh Kumar Mishra">
</div>

<h1>Hitesh Kumar Mishra</h1>

<div class="typing" id="typing"></div>

<div class="signature">
    <img src="Signature.png" alt="Hitesh Signature">
</div>

<div id="clock"></div>
<div id="date"></div>

<a class="btn" href="https://youtube.com/@artbyhitesh-HkM4" target="_blank">
<i class="fab fa-youtube"></i>
YouTube
</a>

<a class="btn" href="https://www.instagram.com/artist_hitesh_04" target="_blank">
<i class="fab fa-instagram"></i>
Instagram

<a class="btn" href="https://wa.me/918260928545" target="_blank">

Telegram
</a>

<a class="btn" href="https://x.com/Hitesh4220" target="_blank">

X (Twitter)
</a>

    <i class="fas fa-user-tie"></i>
    My CV

</div>

Install App 📱
</button>

<footer class="footer">
© 2026 Hitesh Kumar Mishra. All Rights Reserved.
</footer>

<script>

function updateClock(){

let now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString("en-IN",{
timeZone:"Asia/Kolkata"
});

document.getElementById("date").innerHTML =
now.toLocaleDateString("en-IN",{
weekday:"long",
year:"numeric",
month:"long",
day:"numeric"
});

}

setInterval(updateClock,1000);
updateClock();

function toggleMode(){

document.body.classList.toggle("light");

let toggle=document.querySelector(".toggle");

if(document.body.classList.contains("light")){

toggle.innerHTML="☀️";

}else{

toggle.innerHTML="🌙";

}

}

function showToast(msg){

let toast=document.getElementById("toast");

toast.innerHTML=msg;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},2000);

}

function comingSoon(){
showToast("Coming Soon 🚀");
}

window.onload=()=>{
showToast("Welcome Hitesh 👋");
}

const text = [
"Artist 🎨",
"Video Editor 🎬",
"Creative Creator ✨",
"Digital Designer 💻"
];

let count = 0;
let index = 0;
let currentText = "";
let letter = "";

(function type(){

if(count === text.length){
count = 0;
}

currentText = text[count];
letter = currentText.slice(0, ++index);

document.getElementById("typing").textContent = letter;

if(letter.length === currentText.length){
count++;
index = 0;
setTimeout(type,1200);
}else{
setTimeout(type,80);
}

})();

let deferredPrompt;

const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt",(e)=>{
    if (!deferredPrompt) {
  installBtn.style.display = "none";
}

e.preventDefault();

deferredPrompt = e;

installBtn.style.display = "block";

});

installBtn.addEventListener("click", async()=>{

if(deferredPrompt){

deferredPrompt.prompt();

const result = await deferredPrompt.userChoice;

if(result.outcome === "accepted"){
showToast("App Installed 🚀");
}

deferredPrompt = null;

installBtn.style.display = "none";

}

});

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register("./sw.js")
.then(()=>{
console.log("PWA Ready 🚀");
})
.catch((err)=>{
console.log(err);
});

});

}

function openCV() {
    window.open("cv.html", "_blank");
}

</script>

</body>
</html>
